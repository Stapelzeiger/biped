launch:
- node:
    pkg: rl_controller
    exec: sys_id_for_rl
    name: sys_id_for_rl
    param:
      - name: use_sim_time
        value: '$(var use_sim_time)'
    remap:
      - from: /sys_id_for_rl/joint_states
        to: /joint_states
      - from: /sys_id_for_rl/joint_trajectory
        to: /joint_trajectory
    output: screen
    # print GDB backtrace:
    # launch-prefix: gdb -batch --return-child-result -ex run -ex backtrace --args
